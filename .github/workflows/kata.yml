name: kata
on: { workflow_dispatch: {} }
env: { GH_TOKEN: "${{ github.token }}" }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          gh api repos/wty-yy/Clash-Royale-Detection-Dataset --jq '[.size, .default_branch, .pushed_at] | @tsv'
          gh api repos/wty-yy/Clash-Royale-Detection-Dataset/releases --jq '.[] | .tag_name + " " + ([.assets[] | .name + ":" + (.size|tostring)] | join(" "))' | head
          gh api "repos/wty-yy/Clash-Royale-Detection-Dataset/git/trees/HEAD" --jq '.tree[] | .type + " " + .path + " " + ((.size // 0)|tostring)'
          gh api "repos/wty-yy/Clash-Royale-Detection-Dataset/git/trees/HEAD?recursive=1" --jq '.truncated, (.tree | length)'
          gh api "repos/wty-yy/Clash-Royale-Detection-Dataset/git/trees/HEAD?recursive=1" --jq '.tree[] | select(.type=="blob") | .path' | awk -F/ '{print $1"/"$2"/"$3}' | sort | uniq -c | sort -rn | head -40
          gh api repos/wty-yy/Clash-Royale-Detection-Dataset/readme --jq .content | base64 -d | head -90
