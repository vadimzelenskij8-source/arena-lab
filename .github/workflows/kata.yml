name: kata
on: { workflow_dispatch: {} }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          git clone -q --depth 1 --filter=blob:none --no-checkout https://github.com/wty-yy/Clash-Royale-Detection-Dataset kd
          cd kd && git ls-tree -r -l HEAD | awk '{n=split($5,p,"/"); d=p[1]"/"p[2]"/"p[3]; s[d]+=$4; c[d]++} END {for (k in s) print k, c[k], int(s[k]/1048576)"MB"}' | sort | head -60
          git ls-tree -r --name-only HEAD | grep -iE "readme|\.md$|label_list|\.yaml$|\.txt$" | grep -v "/labels/\|images" | head -20
          git checkout HEAD -- README.md 2>/dev/null && sed -n 1,80p README.md
