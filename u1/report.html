function chart(id,n,series,ref){const c=document.getElementById(id),g=c.getContext('2d'),W=c.width,Hh=c.height,P=32,X=v=>P+(W-2*P)*v/Math.max(1,n),Y=v=>Hh-P-(Hh-2*P)*v;
