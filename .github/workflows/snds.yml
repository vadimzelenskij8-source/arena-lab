name: snds
on: { workflow_dispatch: {} }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          pip install -q huggingface_hub pyarrow
          python3 - <<'P'
          import tarfile, io, pyarrow.parquet as pq
          from huggingface_hub import hf_hub_download
          rid = "SudhishNeel/clash-royale-detection"
          t = tarfile.open(hf_hub_download(rid, "bundles/ZC8MrzA1lKw.tar", repo_type="dataset"))
          ms = t.getmembers(); print("BUNDLE members", len(ms))
          for m in ms[:25]: print("  ", m.name, m.size)
          for m in ms:
              if m.name.endswith((".txt", ".json", ".csv")) and m.size < 20000:
                  print("==", m.name); print(t.extractfile(m).read().decode()[:600]); break
          for f in ("synthetic_arena/train-b3-00001-of-00002.parquet",):
              pf = pq.ParquetFile(hf_hub_download(rid, f, repo_type="dataset"))
              print("SYN schema", pf.schema_arrow, "rows", pf.metadata.num_rows)
              r = pf.read_row_group(0).slice(0, 2).to_pylist()
              for row in r: print({k: (str(v)[:300] if k != "image" else "img") for k, v in row.items()})
          P
          python3 -c "
          from huggingface_hub import hf_hub_download; import json
          print(open(hf_hub_download('SudhishNeel/clash-royale-detection','classes.txt',repo_type='dataset')).read().split())" | tr ',' '\n' | wc -l
