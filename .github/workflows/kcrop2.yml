name: kcrop2
on:
  push:
    branches: [main]
    paths: ["kaggle_train/crop2_cpu.py", ".github/workflows/kcrop2.yml"]
env:
  KAGGLE_USERNAME: papai10095
  KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
  KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_KEY }}
jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          pip install -q -U kaggle
          mkdir k && cp kaggle_train/crop2_cpu.py k/
          printf '{"id": "papai10095/cr-det-crop2", "title": "cr det crop2", "code_file": "crop2_cpu.py", "language": "python", "kernel_type": "script", "is_private": true, "enable_gpu": false, "enable_internet": true, "dataset_sources": ["papai10095/cr-synth-det3", "papai10095/cr-real-frames"], "competition_sources": [], "kernel_sources": ["papai10095/cr-det-crop"]}' > k/kernel-metadata.json
          kaggle kernels push -p k
          for i in $(seq 1 8); do sleep 60; kaggle kernels status papai10095/cr-det-crop2 2>&1 | tail -1; done
