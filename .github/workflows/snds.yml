name: snds
on: { workflow_dispatch: {} }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          pip install -q huggingface_hub
          python3 - <<'P'
          from huggingface_hub import HfApi, hf_hub_download
          from collections import Counter
          api = HfApi(); rid = "SudhishNeel/clash-royale-detection"
          info = api.dataset_info(rid, files_metadata=True)
          fs = [(s.rfilename, s.size or 0) for s in info.siblings]
          print("NFILES", len(fs), "GB", round(sum(x for _, x in fs) / 2**30, 2))
          top = Counter(); sz = Counter()
          for f, s in fs:
              k = "/".join(f.split("/")[:2]) if f.count("/") >= 2 else f
              top[k] += 1; sz[k] += s
          for k, n in sorted(top.items()): print("DIR", k, n, round(sz[k] / 2**20), "MB")
          for f, s in fs:
              if f.endswith((".txt", ".md", ".yaml", ".json")) and s < 300000 and f.count("/") <= 1:
                  print("==", f); print(open(hf_hub_download(rid, f, repo_type="dataset")).read()[:2500])
          P
