name: long
on:
  workflow_dispatch:
    inputs:
      workers: { description: "parallel workers (1-20)", default: "16" }
      seg_minutes: { description: "training minutes per segment (3 segments, max ~330)", default: "280" }
permissions: { contents: write, actions: write }
concurrency: { group: long, cancel-in-progress: false }
env:
  ALGO: distill
  DIR: u1
  CRFORGE_SHA: bff1988ea5771744d898cf2ef5dfa71a6579cc6c
  DATA_VERSION: "16.635.8"
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        run: |
          W=${{ github.event.inputs.workers || '16' }}
          echo "matrix=$(python3 -c "import json;print(json.dumps(list(range(min(20,max(1,int('$W')))))))")" >> $GITHUB_OUTPUT
      - uses: actions/checkout@v4
        with: { path: lab }
      - run: git clone https://github.com/voonhous/crforge crforge && git -C crforge checkout "$CRFORGE_SHA" && python3 lab/sim_patch/apply.py crforge
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v4
      - working-directory: crforge
        run: ./gradlew --no-daemon :env:installDist :tables:dataVersionTables -Pcrforge.assetSource=cdn -Pcrforge.dataVersion=$DATA_VERSION
      - run: |
          mkdir -p sim && cp -r crforge/env/build/install/env sim/env && cp -r crforge/python sim/python && cp -r ~/.crforge/tables/$DATA_VERSION sim/tables
          tar czf sim.tgz sim
      - uses: actions/upload-artifact@v4
        with: { name: sim, path: sim.tgz, retention-days: 1 }
  s1:
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        w: ${{ fromJSON(needs.build.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: sim }
      - run: tar xzf sim.tgz
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install ./sim/python && pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: base checkpoint
        run: |
          mkdir -p out
          git fetch origin results 2>/dev/null && SRC=$DIR; [ "$DIR" = smoke ] && SRC=$([ "$ALGO" = distill ] && echo u1 || echo g2)
          (git show origin/results:$SRC/policy.pt > out/policy.pt 2>/dev/null || git show origin/results:d3/policy.pt > out/policy.pt 2>/dev/null) || rm -f out/policy.pt
          mkdir -p b2 && for f in hparams.json history.json; do git show origin/results:$SRC/$f > b2/$f 2>/dev/null || rm -f b2/$f; done
          mkdir -p league && for f in $(git ls-tree --name-only origin/results $SRC/league/ 2>/dev/null); do git show origin/results:$f > league/$(basename $f); done
          [ -n "$(ls league)" ] || git show origin/results:d3/policy.pt > league/v0-xbow.pt 2>/dev/null || true
          ls league
          git show origin/results:$SRC/matchup_weights.json > mw.json 2>/dev/null || rm -f mw.json
          cp out/policy.pt champ.pt 2>/dev/null || true
          git show origin/results:crapi/decks_api.json > api.json 2>/dev/null || rm -f api.json
          git show origin/results:$SRC/eval.json 2>/dev/null | python3 -c "import json,sys; json.dump(json.load(sys.stdin).get('by_card',{}),open('cw.json','w'))" 2>/dev/null || rm -f cw.json
          ls -la out
      - name: train2
        run: |
          set +e -o pipefail
          W=${{ matrix.w }}
          HP=$(python3 train/hparams.py b2 $W ${{ github.run_number }}); echo "hparams $HP"
          HP="$HP $(bash train/groups.sh $W)"; echo "args $HP"
          R=""; [ -s out/policy.pt ] && R="--resume out/policy.pt"
          E=128; [ "$ALGO" = distill ] && E=64
          python train/$ALGO.py --install sim/env --tables sim/tables --out out --envs $E --threads 4 \
            --minutes $(( ${{ github.event.inputs.seg_minutes || '280' }} + 2 )) --eval-minutes 2 --eval-games 640 --final 0 --p0 0.0000 --p1 0.3333 \
            --seed $(( ${{ github.run_number }} * 100 + W + 1000 )) $HP $R 2>&1 | tee out/full.txt | grep -v "^{'iter'" ; R=$?; tail -c 20000 out/full.txt > out/log.txt; rm out/full.txt; exit $R
          
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: "w${{ matrix.w }}-s1", path: out/, retention-days: 3 }
  ceil:
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        w: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: sim }
      - run: tar xzf sim.tgz
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install ./sim/python && pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: base checkpoint
        run: |
          mkdir -p out
          git fetch origin results 2>/dev/null && SRC=$DIR; [ "$DIR" = smoke ] && SRC=$([ "$ALGO" = distill ] && echo u1 || echo g2)
          (git show origin/results:$SRC/policy.pt > out/policy.pt 2>/dev/null || git show origin/results:d3/policy.pt > out/policy.pt 2>/dev/null) || rm -f out/policy.pt
          mkdir -p b2 && for f in hparams.json history.json; do git show origin/results:$SRC/$f > b2/$f 2>/dev/null || rm -f b2/$f; done
          mkdir -p league && for f in $(git ls-tree --name-only origin/results $SRC/league/ 2>/dev/null); do git show origin/results:$f > league/$(basename $f); done
          [ -n "$(ls league)" ] || git show origin/results:d3/policy.pt > league/v0-xbow.pt 2>/dev/null || true
          ls league
          git show origin/results:$SRC/matchup_weights.json > mw.json 2>/dev/null || rm -f mw.json
          cp out/policy.pt champ.pt 2>/dev/null || true
          git show origin/results:crapi/decks_api.json > api.json 2>/dev/null || rm -f api.json
          git show origin/results:$SRC/eval.json 2>/dev/null | python3 -c "import json,sys; json.dump(json.load(sys.stdin).get('by_card',{}),open('cw.json','w'))" 2>/dev/null || rm -f cw.json
          ls -la out
      - name: train2
        run: |
          set +e -o pipefail
          W=${{ matrix.w }}
          HP=$(python3 train/hparams.py b2 $W ${{ github.run_number }}); echo "hparams $HP"
          HP="$HP $(bash train/groups.sh $W)"; echo "args $HP"
          R=""; [ -s out/policy.pt ] && R="--resume out/policy.pt"
          E=128; [ "$ALGO" = distill ] && E=64
          # search settings on the champion, paired games, normal + phone (latency) exam
          V=""; case ${{ matrix.w }} in 1) V="--top 6";; 2) V="--horizon 240";; 3) V="--top 6 --horizon 240";; esac
          B=$(( 3 * ${{ github.event.inputs.seg_minutes || '280' }} + 20 )); [ $B -gt 320 ] && B=320
          python train/distill.py --install sim/env --tables sim/tables --out out --envs 64 --threads 4 --search-only $B $V $R 2>&1 | tail -40; exit ${PIPESTATUS[0]}
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: "ceil-${{ matrix.w }}", path: out/, retention-days: 3 }
  s2:
    needs: [build, s1]
    if: ${{ always() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        w: ${{ fromJSON(needs.build.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: sim }
      - run: tar xzf sim.tgz
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install ./sim/python && pip install torch --index-url https://download.pytorch.org/whl/cpu
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: { name: "w${{ matrix.w }}-s1", path: carry }
      - name: base checkpoint
        run: |
          mkdir -p out
          git fetch origin results 2>/dev/null && SRC=$DIR; [ "$DIR" = smoke ] && SRC=$([ "$ALGO" = distill ] && echo u1 || echo g2)
          (git show origin/results:$SRC/policy.pt > out/policy.pt 2>/dev/null || git show origin/results:d3/policy.pt > out/policy.pt 2>/dev/null) || rm -f out/policy.pt
          mkdir -p b2 && for f in hparams.json history.json; do git show origin/results:$SRC/$f > b2/$f 2>/dev/null || rm -f b2/$f; done
          mkdir -p league && for f in $(git ls-tree --name-only origin/results $SRC/league/ 2>/dev/null); do git show origin/results:$f > league/$(basename $f); done
          [ -n "$(ls league)" ] || git show origin/results:d3/policy.pt > league/v0-xbow.pt 2>/dev/null || true
          ls league
          git show origin/results:$SRC/matchup_weights.json > mw.json 2>/dev/null || rm -f mw.json
          cp out/policy.pt champ.pt 2>/dev/null || true
          git show origin/results:crapi/decks_api.json > api.json 2>/dev/null || rm -f api.json
          git show origin/results:$SRC/eval.json 2>/dev/null | python3 -c "import json,sys; json.dump(json.load(sys.stdin).get('by_card',{}),open('cw.json','w'))" 2>/dev/null || rm -f cw.json
          cp carry/policy.pt out/policy.pt 2>/dev/null || true
          ls -la out carry
      - name: train2
        run: |
          set +e -o pipefail
          W=${{ matrix.w }}
          HP=$(python3 train/hparams.py b2 $W ${{ github.run_number }}); echo "hparams $HP"
          HP="$HP $(bash train/groups.sh $W)"; echo "args $HP"
          R=""; [ -s out/policy.pt ] && R="--resume out/policy.pt"
          E=128; [ "$ALGO" = distill ] && E=64
          python train/$ALGO.py --install sim/env --tables sim/tables --out out --envs $E --threads 4 \
            --minutes $(( ${{ github.event.inputs.seg_minutes || '280' }} + 2 )) --eval-minutes 2 --eval-games 640 --final 0 --p0 0.3333 --p1 0.6667 --carry carry \
            --seed $(( ${{ github.run_number }} * 100 + W + 2000 )) $HP $R 2>&1 | tee out/full.txt | grep -v "^{'iter'" ; R=$?; tail -c 20000 out/full.txt > out/log.txt; rm out/full.txt; exit $R
          
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: "w${{ matrix.w }}-s2", path: out/, retention-days: 3 }
  s3:
    needs: [build, s2]
    if: ${{ always() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        w: ${{ fromJSON(needs.build.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: sim }
      - run: tar xzf sim.tgz
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install ./sim/python && pip install torch --index-url https://download.pytorch.org/whl/cpu
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: { name: "w${{ matrix.w }}-s2", path: carry }
      - name: base checkpoint
        run: |
          mkdir -p out
          git fetch origin results 2>/dev/null && SRC=$DIR; [ "$DIR" = smoke ] && SRC=$([ "$ALGO" = distill ] && echo u1 || echo g2)
          (git show origin/results:$SRC/policy.pt > out/policy.pt 2>/dev/null || git show origin/results:d3/policy.pt > out/policy.pt 2>/dev/null) || rm -f out/policy.pt
          mkdir -p b2 && for f in hparams.json history.json; do git show origin/results:$SRC/$f > b2/$f 2>/dev/null || rm -f b2/$f; done
          mkdir -p league && for f in $(git ls-tree --name-only origin/results $SRC/league/ 2>/dev/null); do git show origin/results:$f > league/$(basename $f); done
          [ -n "$(ls league)" ] || git show origin/results:d3/policy.pt > league/v0-xbow.pt 2>/dev/null || true
          ls league
          git show origin/results:$SRC/matchup_weights.json > mw.json 2>/dev/null || rm -f mw.json
          cp out/policy.pt champ.pt 2>/dev/null || true
          git show origin/results:crapi/decks_api.json > api.json 2>/dev/null || rm -f api.json
          git show origin/results:$SRC/eval.json 2>/dev/null | python3 -c "import json,sys; json.dump(json.load(sys.stdin).get('by_card',{}),open('cw.json','w'))" 2>/dev/null || rm -f cw.json
          cp carry/policy.pt out/policy.pt 2>/dev/null || true
          ls -la out carry
      - name: train2
        run: |
          set +e -o pipefail
          W=${{ matrix.w }}
          HP=$(python3 train/hparams.py b2 $W ${{ github.run_number }}); echo "hparams $HP"
          HP="$HP $(bash train/groups.sh $W)"; echo "args $HP"
          R=""; [ -s out/policy.pt ] && R="--resume out/policy.pt"
          E=128; [ "$ALGO" = distill ] && E=64
          python train/$ALGO.py --install sim/env --tables sim/tables --out out --envs $E --threads 4 \
            --minutes $(( ${{ github.event.inputs.seg_minutes || '280' }} + 60 )) --eval-minutes 60 --eval-games 2120 --xbow-games 1060 --ava-games 640 --champ-games 128 --final 1 --p0 0.6667 --p1 1.0000 --carry carry \
            --seed $(( ${{ github.run_number }} * 100 + W + 3000 )) $HP $R 2>&1 | tee out/full.txt | grep -v "^{'iter'" ; R=$?; tail -c 20000 out/full.txt > out/log.txt; rm out/full.txt; exit $R
          
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: "w${{ matrix.w }}-s3", path: out/, retention-days: 3 }
  select:
    needs: [s3, ceil]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: workers, pattern: "w*-s3" }
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: { path: ceil, pattern: "ceil-*" }
      - name: pick best and publish
        run: |
          git config user.name lab-bot; git config user.email lab-bot@users.noreply.github.com
          if git fetch origin results 2>/dev/null; then git worktree add ../res origin/results && cd ../res && git checkout -B results
          else git worktree add --detach ../res && cd ../res && git checkout --orphan results && git rm -rqf . ; fi
          python ../${{ github.event.repository.name }}/train/select_best.py ../${{ github.event.repository.name }}/workers $DIR ${{ github.run_id }}
          python ../${{ github.event.repository.name }}/train/league.py ../${{ github.event.repository.name }}/workers $DIR ${{ github.run_id }} || true
          python ../${{ github.event.repository.name }}/train/matchups.py $DIR ../${{ github.event.repository.name }}/ceil ../${{ github.event.repository.name }}/workers || true
          python3 -c "import json,glob,sys; json.dump([json.load(open(f)) for f in sorted(glob.glob(sys.argv[1]+'/*/search_variant.json'))], open(sys.argv[2]+'/search_variants.json','w'))" ../${{ github.event.repository.name }}/ceil $DIR || true
          python ../${{ github.event.repository.name }}/train/report.py $DIR ../${{ github.event.repository.name }}/workers
          mkdir -p runs/${{ github.run_id }} && for d in ../${{ github.event.repository.name }}/workers/*; do n=$(basename $d); mkdir -p runs/${{ github.run_id }}/$n; cp $d/eval.json $d/log.txt runs/${{ github.run_id }}/$n/ 2>/dev/null || true; done
          git add -A && git commit -q -m "gen ${{ github.run_id }}" && git push origin results
