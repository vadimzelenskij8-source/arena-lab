name: kstatus
on: { workflow_dispatch: {} }
env:
  KAGGLE_USERNAME: papai10095
  KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
  KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_KEY }}
jobs:
  s:
    runs-on: ubuntu-latest
    steps:
      - run: |
          pip install -q -U kaggle
          for k in cr-det-train cr-det-train3 cr-det-train4 cr-det-post; do kaggle kernels status papai10095/$k 2>&1 | tail -1; done
          kaggle kernels list -m --page-size 10 2>&1 | head -6
          kaggle kernels -h 2>&1 | head -30
          kaggle --version
