name: ksnft
on: { workflow_dispatch: {} }
env:
  KAGGLE_USERNAME: papai10095
  KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
  KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_KEY }}
jobs:
  k:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          pip install -q -U kaggle
          for v in cpu gpu; do
            g=false; [ $v = gpu ] && g=true
            rm -rf k && mkdir k && cp kaggle_train/sn_ft.py k/
            printf '{"id": "papai10095/cr-det-snft-%s", "title": "cr det snft %s", "code_file": "sn_ft.py", "language": "python", "kernel_type": "script", "is_private": true, "enable_gpu": %s, "enable_internet": true, "dataset_sources": ["papai10095/cr-real-frames"], "competition_sources": [], "kernel_sources": []}' $v $v $g > k/kernel-metadata.json
            kaggle kernels push -p k
          done
          for i in $(seq 1 6); do sleep 60; for v in cpu gpu; do kaggle kernels status papai10095/cr-det-snft-$v 2>&1 | tail -1; done; done
