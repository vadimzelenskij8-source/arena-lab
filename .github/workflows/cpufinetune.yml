name: cpufinetune
on:
  push:
    branches: [main]
    paths: ["kaggle_train/trigger_cpu.txt"]
env:
  KAGGLE_USERNAME: papai10095
  KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
  KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_KEY }}
jobs:
  ft:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - name: data
        run: |
          pip install -q -U kaggle ultralytics
          mkdir -p d && cd d
          kaggle kernels output papai10095/cr-det-train -p w -f best.pt 2>/dev/null || kaggle kernels output papai10095/cr-det-train -p w
          kaggle datasets download papai10095/cr-synth-det3 -p s -f classes.json && unzip -o -q s/*.zip -d s 2>/dev/null || true
          kaggle datasets download papai10095/cr-synth-det3 -p s -f shard0.tar; kaggle datasets download papai10095/cr-synth-det3 -p s -f shard1.tar
          cd s && for f in *.zip; do unzip -o -q $f 2>/dev/null || true; done; for t in *.tar; do mkdir -p ${t%.tar}; tar -xf $t -C ${t%.tar}; done; cd ..
          find . -name best.pt; find . -name classes.json; find s -name '*.jpg' | wc -l
      - name: fine-tune on CPU (~5h)
        run: |
          cd d && timeout 300m python3 ../kaggle_train/cpu_finetune.py . ../out 4000 6 2>&1 | grep -vE "^\s+[0-9]+/[0-9]+.*it/s" | tail -40
      - name: to Kaggle (private dataset)
        if: always()
        run: |
          ls -la out || exit 0
          cp $(find d -name classes.json | head -1) out/
          echo '{"title": "cr det cpu", "id": "papai10095/cr-det-cpu", "licenses": [{"name": "other"}]}' > out/dataset-metadata.json
          kaggle datasets version -p out -m cpu 2>/dev/null || kaggle datasets create -p out
