name: hfcount
on: { workflow_dispatch: {} }
env:
  EC_SHA: caa528332e48cb3c5e2f9f86b0653e5d705df50f
  CLASHAI_DATA: /tmp/cd
  CLASHAI_NO_ENGINE_BUILD: "1"
jobs:
  c:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: |
          git clone -q https://github.com/ethan-mcgee/clash-ai ec && git -C ec checkout -q "$EC_SHA" && rm -rf ec/third_party
          pip install -q --no-deps -e ./ec && pip install -q numpy pyyaml pyarrow huggingface_hub
          python -m clashai.data.download 2>&1 | tail -3
          du -sh /tmp/cd; find /tmp/cd -type f | sed 's/.*\.//' | sort | uniq -c
          python - <<'P'
          from clashai.data.download import dataset_dir
          from clashai.data.replays import read_replays
          r = list(read_replays(dataset_dir())); tags = {x.tag for x in r}
          print("REPLAYS", len(r), "unique tags", len(tags))
          import json, glob, pyarrow.parquet as pq
          d = dataset_dir(); print("MANIFEST", open(f"{d}/manifest.json").read()[:1500])
          for sub in sorted({f.split("/")[-2] for f in glob.glob(f"{d}/*/*.parquet")}):
              print("ROWS", sub, sum(pq.ParquetFile(f).metadata.num_rows for f in glob.glob(f"{d}/{sub}/*.parquet")))
          P
