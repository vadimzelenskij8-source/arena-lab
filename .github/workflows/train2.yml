name: train2
on:
  workflow_dispatch:
    inputs:
      workers: { description: "parallel workers (1-20)", default: "20" }
      minutes: { description: "training minutes per worker", default: "95" }
      chain: { description: "start the next generation when done (yes/no)", default: "yes" }
permissions: { contents: write, actions: write }
concurrency: { group: train2, cancel-in-progress: false }
env:
  CRFORGE_SHA: bff1988ea5771744d898cf2ef5dfa71a6579cc6c
  DATA_VERSION: "16.635.8"
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        run: |
          W=${{ github.event.inputs.workers || '20' }}
          echo "matrix=$(python3 -c "import json;print(json.dumps(list(range(min(20,max(1,int('$W')))))))")" >> $GITHUB_OUTPUT
      - run: git clone https://github.com/voonhous/crforge crforge && git -C crforge checkout "$CRFORGE_SHA"
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v4
      - working-directory: crforge
        run: ./gradlew --no-daemon :env:installDist :tables:dataVersionTables -Pcrforge.assetSource=cdn -Pcrforge.dataVersion=$DATA_VERSION
      - run: |
          mkdir -p sim && cp -r crforge/env/build/install/env sim/env && cp -r crforge/python sim/python && cp -r ~/.crforge/tables/$DATA_VERSION sim/tables
          tar czf sim.tgz sim
      - uses: actions/upload-artifact@v4
        with: { name: sim, path: sim.tgz, retention-days: 1 }
  work:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 200
    strategy:
      fail-fast: false
      matrix:
        w: ${{ fromJSON(needs.build.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: sim }
      - run: tar xzf sim.tgz
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install ./sim/python && pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: base checkpoint
        run: |
          mkdir -p out
          git fetch origin results 2>/dev/null && git show origin/results:g2/policy.pt > out/policy.pt 2>/dev/null || rm -f out/policy.pt
          mkdir -p b2 && for f in hparams.json history.json; do git show origin/results:g2/$f > b2/$f 2>/dev/null || rm -f b2/$f; done
          ls -la out
      - name: train2
        run: |
          set +e -o pipefail
          W=${{ matrix.w }}
          HP=$(python3 train/hparams.py b2 $W ${{ github.run_number }}); echo "hparams $HP"
          R=""; [ -s out/policy.pt ] && R="--resume out/policy.pt"
          python train/ppo2.py --install sim/env --tables sim/tables --out out --envs 128 --threads 4 \
            --minutes ${{ github.event.inputs.minutes || '95' }} --eval-minutes 12 --eval-games 640 \
            --seed $(( ${{ github.run_number }} * 100 + W )) $HP $R 2>&1 | tee out/full.txt | grep -v "^{'iter'" ; R=$?; tail -c 20000 out/full.txt > out/log.txt; rm out/full.txt; exit $R
          
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: "w${{ matrix.w }}", path: out/, retention-days: 3 }
  select:
    needs: work
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: workers, pattern: "w*" }
      - name: pick best and publish
        run: |
          git config user.name lab-bot; git config user.email lab-bot@users.noreply.github.com
          if git fetch origin results 2>/dev/null; then git worktree add ../res origin/results && cd ../res && git checkout -B results
          else git worktree add --detach ../res && cd ../res && git checkout --orphan results && git rm -rqf . ; fi
          python ../${{ github.event.repository.name }}/train/select_best.py ../${{ github.event.repository.name }}/workers g2 ${{ github.run_id }}
          python ../${{ github.event.repository.name }}/train/report.py g2
          mkdir -p runs/${{ github.run_id }} && for d in ../${{ github.event.repository.name }}/workers/*; do n=$(basename $d); mkdir -p runs/${{ github.run_id }}/$n; cp $d/eval.json $d/log.txt runs/${{ github.run_id }}/$n/ 2>/dev/null || true; done
          git add -A && git commit -q -m "gen ${{ github.run_id }}" && git push origin results
      - name: next generation
        if: ${{ github.event.inputs.chain != 'no' }}
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          if [ -f STOP ]; then echo "STOP file present"; exit 0; fi
          gh workflow run train2.yml --ref main -f workers=${{ github.event.inputs.workers || '20' }} -f minutes=${{ github.event.inputs.minutes || '95' }} -f chain=yes
