name: ktfl
on: { workflow_dispatch: {} }
env:
  KAGGLE_USERNAME: papai10095
  KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
  KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_KEY }}
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: |
          pip install -q -U kaggle && pip install -q tensorflow-cpu==2.16.1 numpy
          kaggle kernels output papai10095/cr-det-post -p o --file-pattern 'model.tflite' 2>&1 | tail -1 || kaggle kernels output papai10095/cr-det-post -p o | tail -1
          ls -la o
          python - <<'P'
          import numpy as np, tensorflow as tf
          print("TF", tf.__version__)
          try:
              it = tf.lite.Interpreter(model_path="o/model.tflite"); it.allocate_tensors()
              i = it.get_input_details()[0]; it.set_tensor(i["index"], np.zeros(i["shape"], np.float32)); it.invoke()
              print("RUNTIME 2.16.1 OK", i["shape"], it.get_output_details()[0]["shape"])
          except Exception as e:
              print("RUNTIME 2.16.1 FAIL", repr(e)[:1500])
          P
