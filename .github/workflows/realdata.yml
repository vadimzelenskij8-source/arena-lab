name: realdata
on:
  push:
    branches: [main]
    paths: ["realdata/**", ".github/workflows/realdata.yml"]
  workflow_dispatch:
permissions:
  contents: read
env:
  ROBOFLOW_API_KEY: ${{ secrets.ROBOFLOW_API_KEY }}
  KAGGLE_USERNAME: papai10095
  KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
  KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_KEY }}
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: frames from Roboflow -> private Kaggle dataset
        run: |
          python3 realdata/fetch.py frames 2AfIUsYwY6FLkSTjT151,3gh9aamLWvWfSPQGtUrE,QD9ESqN2xDLOlHThBwmE,RCUTC9LisSmWHNL4RVim,hw79a0sCftubkQZdIp0d
          ls frames | wc -l; du -sh frames
          mkdir ds && tar -cf ds/real.tar frames
          cat > ds/dataset-metadata.json <<J
          {"title": "cr real frames", "id": "papai10095/cr-real-frames", "licenses": [{"name": "other"}]}
          J
          pip install -q -U kaggle
          kaggle datasets version -p ds -m "run ${{ github.run_id }}" 2>/dev/null || kaggle datasets create -p ds
