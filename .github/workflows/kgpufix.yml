name: kgpufix
on: { workflow_dispatch: {} }
env:
  KAGGLE_USERNAME: papai10095
  KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
  KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_KEY }}
jobs:
  k:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set +e
          pip install -q -U kaggle
          kaggle kernels list --mine --page-size 100 --csv | cut -d, -f1 | tail -n +2 > mine.txt
          for k in $(cat mine.txt); do s=$(kaggle kernels status $k 2>&1 | tail -1); echo "$k :: $s"; echo "$s" | grep -q QUEUED && { echo "  delete queued $k"; kaggle kernels delete $k -y 2>&1 | tail -1; }; done
          sleep 20
          # one fresh GPU kernel, no accelerator flag (a flagged push is what stays queued), new slug
          rm -rf k && mkdir k && cp kaggle_train/sn_ft2.py k/
          printf '{"id": "papai10095/cr-det-snft3-gpu", "title": "cr det snft3 gpu", "code_file": "sn_ft2.py", "language": "python", "kernel_type": "script", "is_private": true, "enable_gpu": true, "enable_internet": true, "dataset_sources": ["papai10095/cr-real-frames"], "competition_sources": [], "kernel_sources": []}' > k/kernel-metadata.json
          cat k/kernel-metadata.json; kaggle kernels push -p k
          for i in $(seq 1 10); do sleep 30; kaggle kernels status papai10095/cr-det-snft3-gpu 2>&1 | tail -1; done
