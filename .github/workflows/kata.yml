name: kata
on: { workflow_dispatch: {} }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sL https://codeload.github.com/wty-yy/Clash-Royale-Detection-Dataset/tar.gz/master | tar xz --wildcards '*/images/part2/*' 2>/dev/null; D=$(ls -d Clash-Royale-Detection-Dataset-*); du -sh $D
          find $D/images/part2 -name "*.txt" | wc -l; find $D/images/part2 -name "*.jpg" -o -name "*.png" | wc -l
          f=$(find $D/images/part2 -name "*.txt" | head -1); echo $f; head -5 $f; ls $(dirname $f) | head -5
          python3 -c "from PIL import Image;import glob;fs=glob.glob('$D/images/part2/**/*.jpg',recursive=True)[:3];print([Image.open(x).size for x in fs])"
          curl -s https://raw.githubusercontent.com/wty-yy/KataCR/master/katacr/constants/label_list.py | head -60
