name: kall
on:
  push:
    branches: [main]
    paths: ["kaggle_train/all.py", ".github/workflows/kall.yml"]
env:
  KAGGLE_USERNAME: papai10095
  KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
  KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_KEY }}
jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          pip install -q -U kaggle
          mkdir k && cp kaggle_train/all.py k/
          cat > k/kernel-metadata.json <<J
          {"id": "papai10095/cr-det-all", "title": "cr det all", "code_file": "all.py", "language": "python",
           "kernel_type": "script", "is_private": true, "enable_gpu": true, "enable_internet": true,
           "dataset_sources": ["papai10095/cr-synth-det3", "papai10095/cr-real-frames"], "competition_sources": [], "kernel_sources": ["papai10095/cr-det-train"]}
          J
          kaggle kernels push -p k
          sleep 30; kaggle kernels status papai10095/cr-det-all
